<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiZap | Sua Operação no WhatsApp em Outro Nível</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --primary-dark: #c9184a;
            --dark: #0f0f0f;
            --gray: #1a1a1a;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: var(--dark); 
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at center, rgba(255, 77, 109, 0.1) 0%, transparent 70%);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            line-height: 1;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        h1 span { color: var(--primary); }

        p {
            font-size: 1.2rem;
            color: #888;
            max-width: 600px;
            margin-bottom: 3rem;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            padding: 1.2rem 3rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.4);
        }

        .btn-main:hover {
            transform: scale(1.05);
            background: var(--primary-dark);
        }

        .nav-fixed {
            position: fixed;
            top: 0; width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 100;
        }

        .btn-login {
            color: white;
            text-decoration: none;
            font-weight: 600;
            opacity: 0.8;
        }

        .btn-login:hover { opacity: 1; }
    </style>
</head>
<body>
    <nav class="nav-fixed">
        <div class="logo"><i data-lucide="zap"></i> DigiZap</div>
        <a href="/login" class="btn-login">Login</a>
    </nav>

    <section class="hero">
        <h1>O Cardápio <span>mais rápido</span> do Brasil.</h1>
        <p>Aumente suas vendas no WhatsApp com automação inteligente e um cardápio digital que carrega em menos de 1 segundo.</p>
        <a href="/register" class="btn-main">Começar Agora</a>
    </section>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
