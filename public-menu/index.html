<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linda Cake - Cardápio Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="app">
        <!-- Top Navigation (iFood Style) -->
        <header class="top-nav">
            <div class="container nav-wrapper">
                <div class="store-info">
                    <div class="store-logo">
                        <i data-lucide="cake"></i>
                    </div>
                    <div class="store-details">
                        <h1>Linda Cake</h1>
                        <p class="store-status"><span class="status-dot"></span> Aberto agora</p>
                    </div>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn"><i data-lucide="search"></i></button>
                </div>
            </div>
        </header>

        <!-- Category Tabs -->
        <nav class="category-tabs">
            <div class="container tabs-scroll">
                <button class="cat-tab active" data-tab="delivery">Entrega</button>
                <button class="cat-tab" data-tab="order">Encomendas</button>
            </div>
        </nav>

        <!-- Search Bar (Optional but nice) -->
        <div class="container search-container">
            <div class="search-box">
                <i data-lucide="search"></i>
                <input type="text" id="search-input" placeholder="Buscar no cardápio">
            </div>
        </div>

        <!-- Main Menu -->
        <main class="container main-menu">
            <div id="menu-sections">
                <!-- Sections will be injected here -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Carregando cardápio...</p>
                </div>
            </div>
        </main>

        <!-- Cart Footer -->
        <footer id="cart-footer" class="cart-footer hidden">
            <div class="container">
                <button id="view-cart-btn" class="primary-btn cart-btn">
                    <div class="cart-btn-content">
                        <span id="cart-qty-badge">0</span>
                        <strong>Ver sacola</strong>
                    </div>
                    <span id="cart-total-footer">R$ 0,00</span>
                </button>
            </div>
        </footer>

        <!-- Item Detail Modal (iFood Style Popup) -->
        <div id="item-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content item-detail-content">
                <button class="close-modal-btn"><i data-lucide="x"></i></button>
                <div id="item-detail-body">
                    <!-- Item detail content injected here -->
                </div>
                <div class="modal-footer-sticky">
                    <div class="qty-selector">
                        <button class="qty-btn" id="qty-minus"><i data-lucide="minus"></i></button>
                        <span id="detail-qty">1</span>
                        <button class="qty-btn" id="qty-plus"><i data-lucide="plus"></i></button>
                    </div>
                    <button id="add-to-cart-btn" class="primary-btn">
                        Adicionar <span id="add-btn-price">R$ 0,00</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Checkout Modal -->
        <div id="checkout-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content checkout-content">
                <div class="modal-header">
                    <button class="back-btn"><i data-lucide="arrow-left"></i></button>
                    <h2>Finalizar pedido</h2>
                </div>
                <div class="modal-scroll-body">
                    <div id="checkout-items-list" class="checkout-items"></div>
                    
                    <div class="checkout-form">
                        <section class="form-section">
                            <h3>Seus dados</h3>
                            <input type="text" id="user-name" placeholder="Nome completo" class="ifood-input">
                            <input type="text" id="user-phone" placeholder="WhatsApp (DDD + Número)" class="ifood-input">
                        </section>

                        <section id="delivery-info" class="form-section">
                            <h3>Endereço de entrega</h3>
                            <textarea id="user-address" placeholder="Rua, número, bairro e referências" class="ifood-input"></textarea>
                        </section>

                        <section id="order-info" class="form-section hidden">
                            <h3>Data e hora da retirada</h3>
                            <div class="input-row">
                                <input type="date" id="order-date" class="ifood-input">
                                <input type="time" id="order-time" class="ifood-input">
                            </div>
                        </section>
                    </div>

                    <div class="order-summary">
                        <div class="summary-line">
                            <span>Subtotal</span>
                            <span id="summary-subtotal">R$ 0,00</span>
                        </div>
                        <div class="summary-line total">
                            <span>Total</span>
                            <span id="summary-total">R$ 0,00</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer-sticky">
                    <button id="place-order-btn" class="primary-btn">
                        Fazer pedido <i data-lucide="chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Success Screen -->
        <div id="success-screen" class="full-screen hidden">
            <div class="success-box">
                <div class="success-check">
                    <i data-lucide="check"></i>
                </div>
                <h2>Pedido enviado!</h2>
                <p>A Lily já te mandou uma mensagem no WhatsApp para confirmar o status.</p>
                <div class="success-actions">
                    <a id="ext-payment-link" href="#" target="_blank" class="primary-btn">Pagar agora</a>
                    <button class="text-btn" onclick="location.reload()">Início</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
